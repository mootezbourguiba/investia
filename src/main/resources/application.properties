# Configuration pour MySQL (utilisée en production)
spring.datasource.url=jdbc:mysql://localhost:3306/investiaDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# URL de base de l'API CoinGecko
coingecko.base-url=https://api.coingecko.com/api/v3
spring.jpa.hibernate.ddl-auto=update

# Delay en millisecondes entre les requêtes à l'API CoinGecko (pour le rate limiting)
coingecko.rate-limit-delay=5000